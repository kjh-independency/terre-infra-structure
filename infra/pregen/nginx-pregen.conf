# terre-lab 개선 1: nginx-1106.conf(4ae439fb frontend/nginx.conf)에 '미리 만든 타일' 경로만 더한 설정.
# 바뀐 곳은 [개선 1] 표시가 있는 블록뿐이고, 나머지는 11/6 설정과 같다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 502m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;

    # [개선 1] 행정구역(시군구·읍면동) 타일: 미리 만든 파일이 있으면 파일, 없으면 지금처럼 backend.
    # 응답은 backend 와 같게 맞춘다(200, application/vnd.mapbox-vector-tile, Cache-Control: no-cache, public).
    location ~ ^/api/v1/tiles/(sgg|emd)/(\d+)/(\d+)/(\d+)\.mvt$ {
        root /srv/pregen;
        types { }
        default_type application/vnd.mapbox-vector-tile;
        try_files /$1/$2/$3/$4.mvt @tile_backend;
        add_header Cache-Control "no-cache, public" always;
        add_header X-Tile-Source pregen always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # [개선 1] 보호지역 타일: 공개 여부가 바뀌면 옛 주소로도 즉시 사라져야 한다(팀 요구).
    # tilegen 이 변경을 감지하면 current 를 빈 폴더로 바꿔 그 순간부터 backend 가 현재 상태로 그리고,
    # 새로 다 만든 뒤에 current 를 새 폴더로 바꾼다. backend 처럼 no-store, ETag 없음.
    location ~ ^/api/v1/tiles/protected/(\d+)/(\d+)/(\d+)\.mvt$ {
        root /srv/pregen;
        types { }
        default_type application/vnd.mapbox-vector-tile;
        etag off;
        try_files /protected/current/$1/$2/$3.mvt @tile_backend;
        add_header Cache-Control "no-store" always;
        add_header X-Tile-Source pregen always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # [개선 1] 파일이 없을 때(아직 안 만들었거나, 보호지역이 바뀌어 숨긴 동안, 범위 밖 줌·지역)는 지금처럼 backend 가 만든다.
    location @tile_backend {
        proxy_cache off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 930s;
        add_header X-Tile-Source backend always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # API·지도 타일은 백엔드로 (같은 주소로 보여서 로그인 쿠키가 그대로 오간다)
    location /api/ {
        # 인증·권한 응답과 갱신된 타일을 서버 캐시로 대체하지 않는다.
        proxy_cache off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 930s;
    }

    # 지도 워커(.mjs)는 자바스크립트로 알려야 브라우저가 모듈 워커로 실행해요
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        expires 1d;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 안에 add_header 가 있으면 바깥 것은 이어받지 않아서 다시 적는다
        add_header X-Content-Type-Options nosniff always;
    }

    # 한 페이지 앱: 모르는 주소는 index.html
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
