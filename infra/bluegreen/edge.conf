# terre-lab 입구 nginx (②-1 블루-그린 + ④ HTTPS 입구)
# 지금 서비스 중인 색은 /etc/nginx/bg/upstream.conf(= bluegreen/state/upstream.conf)가 정한다.
# 배포 스크립트(bg.sh)가 그 파일을 새 색으로 바꾸고 'nginx -s reload' 한다.
# reload 는 처리 중인 요청을 끊지 않는다: 새 설정으로 새 일꾼을 띄우고, 옛 일꾼은 맡은 요청을 끝낸 뒤 내려간다.
#
# 입구는 세 개다(모두 서버 안 127.0.0.1 에만 열림, 공용 서버 방화벽은 건드리지 않는다)
#   443  (서버의 18443) : 손님용 HTTPS 입구. TLS 를 여기서 풀고 안쪽은 평문(입구에서 TLS 종료)
#   8080 (서버의 18080) : 손님용 평문 입구. 아무것도 넘기지 않고 HTTPS 로 돌려보내기만 한다(301)
#   80   (서버의 18088) : 안쪽 전용 평문. 도커 네트워크 안의 부하 도구(k6)·tilegen 과 서버 안 측정 도구가 쓴다
#                         (운영이라면 사설망 안쪽 통로에 해당, 바깥에는 열지 않는다)
include /etc/nginx/bg/upstream.conf;

# ---- 안쪽 전용 평문 ----
server {
    listen 80;
    server_name _;
    client_max_body_size 502m;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 930s;
        proxy_buffering off;          # 큰 응답·느린 응답을 앱 nginx 그대로 흘려보낸다
    }
}

# ---- 손님용 평문: HTTPS 로 돌려보내기만 ----
server {
    listen 8080;
    server_name _;
    return 301 https://$host:18443$request_uri;   # 실험실이라 포트를 붙인다(운영이면 https://$host$request_uri)
}

# ---- 손님용 HTTPS 입구 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 502m;

    ssl_certificate     /etc/nginx/tls/lab.crt;   # 실험용 자체 서명 인증서(도메인이 없어서). 운영이면 ACM·Let's Encrypt
    ssl_certificate_key /etc/nginx/tls/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;                # 오래된 TLS 1.0·1.1 은 받지 않는다
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;

    # HSTS: 이 주소는 앞으로 HTTPS 로만 오라고 브라우저에 알린다(1년). 첫 접속을 가로채 평문으로 끌어내리는 공격을 막는다
    # 하위 도메인·preload 는 붙이지 않는다(실험실 주소라 영향 범위를 넓히지 않음)
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 930s;
        proxy_buffering off;
    }
}
