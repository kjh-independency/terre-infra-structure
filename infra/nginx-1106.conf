server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 502m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;

  # API·지도 타일은 백엔드로 (같은 주소로 보여서 로그인 쿠키가 그대로 오간다)
  location /api/ {
    # 인증·권한 응답과 갱신된 타일을 서버 캐시로 대체하지 않는다.
    proxy_cache off;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 930s;
  }

  # 지도 워커(.mjs)는 자바스크립트로 알려야 브라우저가 모듈 워커로 실행해요
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    expires 1d;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    # location 안에 add_header 가 있으면 바깥 것은 이어받지 않아서 다시 적는다
    add_header X-Content-Type-Options nosniff always;
  }

  # 한 페이지 앱: 모르는 주소는 index.html
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
